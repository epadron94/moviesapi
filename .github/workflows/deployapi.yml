name: Deployapi

on:
  push:
    branches: # 1st approach, generar un segundo branch "prod" y referenciarlo aqui
      - develop

jobs:
  build:
    runs-on: ubuntu-latest //revisar el OS del webapp

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up NETCORE
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0'

      - name: Validate dependencies
        run: dotnet restore Moviesapp.sln  --force
      
      #- name: Dependency caching
      #  uses: actions/cache@v3
      #  with:
      #    path: ~/.nuget/packages
      #    key: ${{runner.os}}-nuget-${{ hashFiles}}

      - name: Build
        run: dotnet build moviesapi/moviesapi.csproj --configuration Release

      - name: Publish
        run: dotnet publish moviesapi/moviesapi.csproj --configuration Release --output ./publish

      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: movieswebapi
          path: ./publish
  deploy:
    permissions:
      contents: none
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: movieswebapi
     

      #- name: Deploy to webapp
      #  uses: azure/webapps-deploy@v3
      #  with:
      #    app-name: 'movieswebapi'
      #    publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE}}
      #    package: ./publish